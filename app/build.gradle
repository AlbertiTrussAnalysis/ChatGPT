plugins {
    id 'com.android.application'
}

android {
    namespace 'com.thomas.punktetracker'
    compileSdk 35

    defaultConfig {
        applicationId 'com.thomas.punktetracker'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '2.2'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
